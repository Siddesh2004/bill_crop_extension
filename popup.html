<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 14px;
      width: 300px;
      padding: 16px;
      margin: 0;
    }

    h2 {
      margin: 0 0 6px 0;
      font-size: 15px;
    }

    p {
      margin: 0 0 12px 0;
      color: #555;
      font-size: 13px;
      line-height: 1.4;
    }

    button {
      padding: 10px 14px;
      width: 100%;
      font-size: 14px;
      cursor: pointer;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 4px;
    }

    button:disabled {
      background: #aaa;
      cursor: default;
    }

    #status {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <h2>Bill Cropper</h2>

  <p>
    Crops the billing PDF open in this tab and opens a print-ready
    A5&nbsp;landscape PDF in a new tab. Print manually using Chrome's
    Print button.
  </p>

  <button id="go">Crop current PDF</button>

  <div id="status"></div>

  <!-- Load the bundled IIFE (popup.js + findInvoiceBounds + pdf-lib + pdfjs) -->
  <script src="popup.bundle.js"></script>
</body>
</html>
